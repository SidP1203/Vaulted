services:
  - type: web
    name: vaulted-web-solutions
    runtime: node
    buildCommand: npm install && npm run build && npm run db:push
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vaulted-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: vaulted-db
    databaseName: vaulted
    user: vaulted
